name = "iris-wasm"
defaultTargets = ["Wasm", "IrisWasm", "WasmTest"]

[leanOptions]
autoImplicit = false

[[require]]
name = "iris"
git.url = "https://github.com/leanprover-community/iris-lean.git"
git.subDir = "Iris"
rev = "v4.36.0"

[[lean_lib]]
name = "Wasm"

[[lean_lib]]
name = "IrisWasm"

[[lean_lib]]
name = "WasmTest"
globs = ["WasmTest.+"]
